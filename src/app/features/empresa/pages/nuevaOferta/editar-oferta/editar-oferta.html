<p-toast></p-toast>

<div class="p-4" style="max-width: 1000px; margin: 0 auto;">
  <div class="p-6 bg-white rounded-xl shadow-md border border-gray-100">
    
    <div class="flex items-center gap-3 mb-6 border-b pb-4">
      <div class="w-10 h-10 bg-orange-50 rounded-lg flex items-center justify-center">
        <i class="pi pi-pencil text-orange-500 text-xl"></i>
      </div>
      <h2 class="text-2xl font-bold text-slate-800">Editar Oferta: {{ ofertaCargada?.nombre || 'Cargando...' }}</h2>
    </div>

    @if (cargandoDatos) {
      <div class="space-y-4">
        <p-skeleton width="100%" height="3rem"></p-skeleton>
        <p-skeleton width="100%" height="3rem"></p-skeleton>
        <p-skeleton width="100%" height="8rem"></p-skeleton>
      </div>
    } @else {
      <app-form-oferta 
        [datosIniciales]="ofertaCargada" 
        [familias]="familias"
        [listaTitulos]="listaTitulos"
        [cargando]="cargando"
        [erroresApi]="erroresApi"
        (alGuardar)="actualizarOferta($event)"
        (alCancelar)="volver()">
      </app-form-oferta>
    }

  </div>
</div>
