<div class="min-h-screen bg-slate-50 flex flex-col font-sans">
  
  <app-navbar
    [nombre]="nombreUsuario" 
    (onMenuToggle)="menuVisible = true">
  </app-navbar>

  <div class="flex-1 flex justify-center w-full mt-4 md:mt-8 mb-10 px-2 md:px-4">
    <div class="flex w-full max-w-[1700px] gap-8">
      
      <aside class="w-64 xl:w-72 hidden lg:flex flex-col gap-4 shrink-0">
        <app-sidebar-empresa></app-sidebar-empresa>
      </aside>

      <main class="flex-1 bg-white rounded-3xl md:rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden min-h-[70vh]">
        <div class="p-4 md:p-10"> 
          <router-outlet></router-outlet>
        </div>
      </main>
    </div>
  </div>
</div>

<p-drawer [(visible)]="menuVisible" header="Gestión Empresa" [style]="{ width: '320px' }">
  <div class="h-full overflow-y-auto pt-4">
    <app-sidebar-empresa (onLinkClick)="menuVisible = false"></app-sidebar-empresa>
  </div>
</p-drawer>
