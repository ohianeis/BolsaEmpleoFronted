<div class="min-h-screen bg-slate-50 flex flex-col">
 <nav class="w-full bg-white border-b border-slate-200 px-4 py-6 shadow-sm z-10 flex justify-center">
  <div class="w-full max-w-[1700px] flex justify-between items-center px-4">
    
    <div class="flex items-center gap-4 md:gap-6">
      <button pButton icon="pi pi-bars" class="p-button-text p-button-secondary md:hidden!" (click)="menuVisible = true"></button>

      <div class="w-24 h-16 md:w-32 md:h-24 overflow-hidden rounded-2xl bg-white flex items-center justify-center p-3 border border-sky-100 shadow-sm">
        <img src="assets/img/cipBurlada.jpg" alt="logo" class="w-full h-full object-contain" />
      </div>

      <div class="flex flex-col justify-center">
        <h1 class="text-slate-800 text-xl md:text-3xl font-black tracking-tighter leading-none uppercase m-0">
          Politécnico <span class="text-sky-600 font-bold">CIP Burlada</span>
        </h1>
        <div class="flex items-center gap-2 mt-2">
          <span class="px-3 py-1 bg-sky-600 text-white text-[11px] md:text-[12px] font-black uppercase tracking-widest rounded-lg shadow-md shadow-sky-100">
            Panel Reclutador
          </span>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-4 md:gap-8 bg-sky-50/50 py-3 px-6 rounded-3xl border border-sky-100 shadow-inner">
      <div class="hidden sm:flex flex-col items-end border-r border-sky-200 pr-6">
        <span class="text-[18px] font-black text-slate-700 leading-none tracking-tight">{{ nombreUsuario }}</span>
        <span class="text-[12px] text-sky-600 font-bold uppercase mt-1.5 italic tracking-wide">
          Empresa Colaboradora
        </span>
      </div>

      <div class="flex items-center gap-4">
        <p-avatar 
          icon="pi pi-building" 
          shape="circle" 
          [style]="{'width': '3.5rem', 'height': '3.5rem', 'font-size': '1.5rem'}"
          styleClass="bg-sky-600 text-white shadow-lg shadow-sky-200 border-2 border-sky-400">
        </p-avatar>
        
        <app-log-out class="scale-125 origin-left"></app-log-out>
      </div>
    </div>

  </div>
</nav>
  <div class="flex-1 flex justify-center w-full mt-4 md:mt-8 mb-10 px-2 md:px-4">
    <div class="flex w-full max-w-[1700px] gap-8">
      
      <aside class="w-64 xl:w-72 hidden md:flex flex-col gap-4 flex-shrink-0">
        <div class="bg-white rounded-[2.5rem] p-5 shadow-sm border border-slate-100">
           <ng-container *ngTemplateOutlet="menuItems"></ng-container>
        </div>
        
        <div class="p-6 bg-gradient-to-br from-sky-500 to-blue-700 rounded-[2.5rem] text-white shadow-md 
                    cursor-pointer hover:shadow-xl hover:scale-[1.02] transition-all duration-300 group"
             routerLink="nueva-oferta">
          <div class="flex justify-between items-start mb-3">
            <i class="pi pi-plus-circle text-2xl opacity-50 group-hover:opacity-100 transition-opacity"></i>
            <i class="pi pi-arrow-up-right text-xs opacity-50 group-hover:opacity-100"></i>
          </div>
          <p class="font-bold text-sm mb-1 text-white">Publicar Vacante</p>
          <p class="text-sky-100 text-[10px] leading-relaxed">
            Encuentra el talento ideal entre nuestros alumnos titulados.
          </p>
        </div>

        <div class="p-6 bg-slate-800 rounded-[2.5rem] text-white shadow-md 
                    cursor-pointer hover:shadow-xl hover:scale-[1.02] transition-all duration-300 group"
             routerLink="ayuda">
          <div class="flex justify-between items-start mb-3">
            <i class="pi pi-info-circle text-2xl opacity-50 group-hover:opacity-100 transition-opacity"></i>
            <i class="pi pi-book text-xs opacity-50 group-hover:opacity-100"></i>
          </div>
          <p class="font-bold text-sm mb-1 text-white">Guía del Reclutador</p>
          <p class="text-slate-400 text-[10px] leading-relaxed">
            Aprende a gestionar procesos y usar los filtros de afinidad.
          </p>
        </div>
      </aside>

      <main class="flex-1 bg-white rounded-3xl md:rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden min-h-[70vh]">
        <div class="p-4 md:p-6 lg:p-8"> 
          <router-outlet></router-outlet>
        </div>
      </main>
    </div>
  </div>
</div>

<ng-template #menuItems>
  <div class="menu-items-empresa"> 
    <button pButton label="Dashboard" icon="pi pi-home" 
            class="p-button-text w-full" 
            routerLink="/empresa/dashboard" 
            routerLinkActive="active-empresa">
    </button>
    
    <button pButton label="Mis Ofertas" icon="pi pi-list" 
            class="p-button-text w-full" 
            routerLink="/empresa/mis-ofertas" 
            routerLinkActive="active-empresa">
    </button>

    <button pButton label="Buscar Talento" icon="pi pi-search" 
            class="p-button-text w-full" 
            routerLink="/empresa/buscar-talento" 
            routerLinkActive="active-empresa">
    </button>

    <button pButton label="Perfil Empresa" icon="pi pi-user-edit" 
            class="p-button-text w-full" 
            routerLink="/empresa/perfil" 
            routerLinkActive="active-empresa">
    </button>

<p-divider></p-divider>
<button pButton label="Crear Nueva Oferta" icon="pi pi-plus" 
        class="p-button-text w-full btn-crear-oferta" 
        routerLink="/empresa/nueva-oferta"></button>
  </div>
</ng-template>
