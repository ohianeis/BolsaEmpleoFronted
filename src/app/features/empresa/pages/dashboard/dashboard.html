<div class="min-h-screen bg-slate-50 flex flex-col">
  
  <nav class="w-full bg-white border-b border-slate-200 px-4 py-4 shadow-sm z-10 flex justify-center">
    <div class="w-full max-w-[1700px] flex justify-between items-center px-2">
      
      <div class="flex items-center gap-2 md:gap-4">
        <button pButton icon="pi pi-bars" 
                class="p-button-text p-button-secondary md:!hidden" 
                (click)="menuVisible = true">
        </button>

       <div class="w-20 h-14 md:w-28 md:h-20 overflow-hidden rounded-xl bg-white flex items-center justify-center p-2 border border-slate-100 shadow-sm">
    <img src="assets/img/cipBurlada.jpg" alt="logo cip burlada" class="w-full h-full object-contain">
</div>

        <div class="flex flex-col justify-center">
          <h1 class="text-slate-800 text-lg md:text-xl font-black tracking-tight leading-none uppercase m-0">
            Politécnico <span class="text-slate-500 font-bold">CIP Burlada</span>
          </h1>
          <div class="flex items-center gap-2 mt-2">
            <span class="px-2 py-0.5 bg-emerald-600 text-white text-[9px] md:text-[10px] font-black uppercase tracking-widest rounded-md">
              Panel Reclutador
            </span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2 md:gap-6 bg-slate-50 py-1 md:py-2 px-2 md:px-4 rounded-2xl border border-slate-100">
        <div class="hidden sm:flex flex-col items-end border-r border-slate-200 pr-4">
          <span class="text-sm font-black text-slate-700 leading-none">{{ nombreUsuario }}</span>
          <span class="text-[10px] text-emerald-600 font-bold uppercase mt-1 italic">Empresa Colaboradora</span>
        </div>
        
        <div class="flex items-center gap-1 md:gap-3">
          <p-avatar icon="pi pi-building" shape="circle" styleClass="bg-white text-emerald-600 border border-emerald-100 shadow-sm"></p-avatar>
          <button pButton icon="pi pi-sign-out" 
                  class="p-button-rounded p-button-danger p-button-text p-button-sm hover:bg-red-50"
                  (click)="onLogout()"></button>
        </div>
      </div>
    </div>
  </nav>

  <div class="flex-1 flex justify-center w-full mt-4 md:mt-8 mb-10 px-2 md:px-4">
    <div class="flex w-full max-w-[1700px] gap-8">
      
 <aside class="w-64 xl:w-72 hidden md:flex flex-col gap-4 flex-shrink-0 transition-all duration-300">
  
  <div class="bg-white rounded-[2.5rem] p-5 shadow-sm border border-slate-100">
     <ng-container *ngTemplateOutlet="menuItems"></ng-container>
  </div>
  
  <div class="p-6 bg-gradient-to-br from-emerald-600 to-teal-700 rounded-[2.5rem] text-white shadow-md 
              cursor-pointer hover:shadow-xl hover:scale-[1.02] transition-all duration-300 group"
       routerLink="nueva-oferta">
    <div class="flex justify-between items-start mb-3">
      <i class="pi pi-plus-circle text-2xl opacity-50 group-hover:opacity-100 transition-opacity"></i>
      <i class="pi pi-arrow-up-right text-xs opacity-50 group-hover:opacity-100"></i>
    </div>
    <p class="font-bold text-sm mb-1">Publicar Vacante</p>
    <p class="text-emerald-100 text-[10px] leading-relaxed">
      Encuentra el talento ideal entre nuestros alumnos titulados.
    </p>
  </div>

  <div class="p-6 bg-slate-800 rounded-[2.5rem] text-white shadow-md 
              cursor-pointer hover:shadow-xl hover:scale-[1.02] transition-all duration-300 group"
        routerLink="ayuda">
    <div class="flex justify-between items-start mb-3">
      <i class="pi pi-info-circle text-2xl opacity-50 group-hover:opacity-100 transition-opacity"></i>
      <i class="pi pi-book text-xs opacity-50 group-hover:opacity-100"></i>
    </div>
    <p class="font-bold text-sm mb-1">Guía del Reclutador</p>
    <p class="text-slate-400 text-[10px] leading-relaxed">
      Aprende a gestionar procesos y usar los filtros de afinidad.
    </p>
  </div>

</aside>

   <main class="flex-1 bg-white rounded-3xl md:rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden min-h-[70vh]">
  <div class="p-4 md:p-6 lg:p-8"> 
    <router-outlet></router-outlet>
  </div>
</main>
    </div>
  </div>
</div>

<p-drawer [(visible)]="menuVisible" [header]="'Menú Gestión'" [style]="{ width: '280px' }">
  <div class="flex flex-col h-full">
    <nav class="flex flex-col gap-2 mt-4">
      <ng-container *ngTemplateOutlet="menuItems"></ng-container>
    </nav>
  </div>
</p-drawer>

<ng-template #menuItems>
  <button pButton label="Dashboard" icon="pi pi-home" class="p-button-text w-full text-left mb-1" 
          routerLink="/empresa/dashboard" routerLinkActive="bg-slate-100 font-bold"></button>
  
  <button pButton label="Mis Ofertas" icon="pi pi-list" class="p-button-text w-full text-left mb-1" 
          routerLink="/empresa/mis-ofertas" routerLinkActive="bg-slate-100 font-bold"></button>

  <button pButton label="Buscar Talento" icon="pi pi-search" class="p-button-text w-full text-left mb-1" 
          routerLink="/empresa/buscar-talento" routerLinkActive="bg-slate-100 font-bold"></button>

  <button pButton label="Perfil Empresa" icon="pi pi-user-edit" class="p-button-text w-full text-left mb-4" 
          routerLink="/empresa/perfil" routerLinkActive="bg-slate-100 font-bold"></button>

  <p-divider></p-divider>

  <button pButton label="Crear Nueva Oferta" icon="pi pi-plus" 
          class="w-full bg-emerald-700 hover:bg-emerald-800 border-none text-white font-bold rounded-xl mt-4" 
          routerLink="/empresa/nueva-oferta"></button>
</ng-template>
