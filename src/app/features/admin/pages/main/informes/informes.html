<div class="bg-white p-8 rounded-[3rem] border border-slate-100 shadow-sm flex flex-col justify-between h-full min-h-[400px]">
  
  <div class="space-y-8">
    <div class="flex items-center gap-4">
      <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center shadow-sm">
        <i class="pi pi-file-excel text-xl"></i>
      </div>
      <div>
        <h3 class="text-lg font-black text-slate-800 uppercase tracking-tighter m-0">Generador de Reportes</h3>
        <p class="text-xs text-slate-400 font-bold uppercase tracking-widest mt-1">Exportación oficial ExcelJS</p>
      </div>
    </div>

    <div class="flex flex-col gap-3">
      <label class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] ml-2">Selecciona la métrica</label>
      <p-select
        [options]="tiposInformes"
        [(ngModel)]="informeSeleccionado"
        optionLabel="label"
        placeholder="¿Qué informe necesitas hoy?"
        appendTo="body"
        class="w-full bg-slate-50! border-slate-100! rounded-2xl! py-3! text-sm! font-bold shadow-inner"
        [disabled]="exportando">
      </p-select>
    </div>
  </div>

  <div class="mt-8">
    <button
      pButton
      icon="pi pi-download"
      [label]="exportando ? 'PROCESANDO DATOS...' : 'GENERAR INFORME OFICIAL'"
      (click)="generarInforme()"
      [disabled]="!informeSeleccionado || exportando"
      class="p-button-success  p-button-rounded bg-emerald-600! border-none w-full h-[60px] font-black text-xs tracking-widest shadow-lg hover:bg-emerald-700 transition-all active:scale-[0.98]">
    </button>
    
    <div class="flex items-center justify-center gap-2 mt-4 opacity-40">
      <i class="pi pi-lock text-[10px]"></i>
      <span class="text-xs font-black uppercase tracking-widest text-slate-600">Documento interno confidencial</span>
    </div>
  </div>

</div>
