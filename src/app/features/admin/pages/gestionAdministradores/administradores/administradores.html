<p-toast></p-toast>

<div class="p-8 bg-slate-50 min-h-screen">
  <div class="bg-white rounded-[3rem] shadow-sm border border-slate-100 overflow-hidden">
    
    <p-tabs [(value)]="activeIndex">
      <p-tablist class="border-b border-slate-100 bg-white/50 backdrop-blur-md">
        <p-tab [value]="3" class="group transition-all duration-300">
          <div class="flex items-center py-4 px-6">
            <i class="pi pi-shield mr-3 text-lg text-emerald-500"></i>
            <span class="text-[14px] font-black uppercase tracking-widest text-slate-600 group-hover:text-emerald-600">Personal Staff</span>
          </div>
        </p-tab>
      </p-tablist>

      <p-tabpanels>
        <p-tabpanel [value]="3" class="p-6">
          
          <app-admin-tabla
            [usuarios]="admins" 
            [totalRecords]="totalAdmins" 
            [loading]="loadingStaff"
            [rows]="rows"
            (onLazyLoad)="cargarStaff($event)"
            (onCreate)="verDialogCrear = true"
            (onResetPass)="resetearPasswordStaff($event)"
            (onBaja)="abrirDialogoBaja($event)"
            (onReactivar)="reactivarAdmin($event)">
          </app-admin-tabla>

        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  </div>
</div>

<app-admin-dialogo-crear
  [(visible)]="verDialogCrear" 
  [resetData]="resetData"
  (newAdmin)="confirmarCrearAdmin($event)"
  (copiar)="copiarPassword($event)">
</app-admin-dialogo-crear>

<app-admin-dialogo-baja
  [(visible)]="verDialogBaja" 
  [motivos]="motivos"
  [loading]="loadingAccion"
  (bajaAdmin)="confirmarBajaForzosa($event)">
</app-admin-dialogo-baja>
