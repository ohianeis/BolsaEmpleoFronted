<div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden mb-12">
  <p-table #dt [value]="titulos" [loading]="cargando" [rows]="10" [paginator]="true" styleClass="p-datatable-sm">
    <ng-template pTemplate="caption">
      <div class="flex justify-end p-2">
        <p-selectButton [options]="stateOptions" [(ngModel)]="filtroEstado" 
                        (onChange)="filtradoTitulos($event)" optionLabel="label" optionValue="value">
        </p-selectButton>
      </div>
    </ng-template>
    
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="titulo" class="p-6 bg-slate-50 text-slate-400 text-[12px] uppercase font-black">Titulación <p-sortIcon field="titulo"></p-sortIcon></th>
        <th pSortableColumn="familia" class="p-6 bg-slate-50 text-slate-400 text-[12px] uppercase font-black text-center">Familia <p-sortIcon field="familia"></p-sortIcon></th>
        <th pSortableColumn="nivel" class="p-6 bg-slate-50 text-slate-400 text-[12px] uppercase font-black text-center">Nivel  <p-sortIcon field="nivel"></p-sortIcon></th>
        <th class="p-6 bg-slate-50 text-slate-400 text-[12px] uppercase font-black text-center">Estado</th>
        <th class="p-6 bg-slate-50 text-slate-400 text-[12px] uppercase font-black text-center">Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-t>
      <tr class="hover:bg-slate-50/50">
        <td class="p-6 font-bold text-slate-700 capitalize">{{ t.titulo }}</td>
        <td class="p-6 text-center text-slate-500">{{ t.familia }}</td>
        <td class="p-6 text-center">
          <span class="px-3 py-1 bg-slate-100 text-slate-600 text-[12px] font-black uppercase rounded-lg">{{ t.nivel }}</span>
        </td>
        <td class="p-6 text-center">
          <p-tag [severity]="t.estado === 'activo' ? 'success' : 'secondary'" [value]="t.estado | uppercase" [rounded]="true"></p-tag>
        </td>
        <td class="p-6 text-center">
           <div class="flex justify-center gap-2">
              @if (t.estado === 'inactivo') {
                <button pButton icon="pi pi-refresh" class="p-button-text p-button-success" (click)="onReactivate.emit(t)"></button>
              }
              <button pButton icon="pi pi-pencil" class="p-button-text p-button-secondary" (click)="editar(t)"></button>
              @if (t.estado === 'activo') {
                <button pButton icon="pi pi-trash" class="p-button-text p-button-danger" (click)="onDelete.emit(t.id)"></button>
              }
           </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [(visible)]="displayDialog" [header]="tituloDialog" [modal]="true" [style]="{width: '500px'}">
  <div class="flex flex-col gap-4 mt-2">
    <div class="flex flex-col gap-1">
      <label class="font-bold text-slate-600">Nombre de la Titulación</label>
      <input pInputText [(ngModel)]="nuevoTitulo.nombre" class="w-full" />
    </div>
    <div class="flex flex-col gap-1">
      <label class="font-bold text-slate-600">Nivel</label>
      <p-select [options]="niveles" appendTo="body" [(ngModel)]="nuevoTitulo.nivel" optionLabel="nivel" optionValue="id" placeholder="Selecciona Nivel" class="w-full"></p-select>
    </div>
    <div class="flex flex-col gap-1">
      <label class="font-bold text-slate-600">Familia Profesional</label>
      <p-select [options]="familias" appendTo="body" [(ngModel)]="nuevoTitulo.familia" optionLabel="nombre" optionValue="id" placeholder="Selecciona Familia" class="w-full"></p-select>
    </div>
  </div>
  <ng-template pTemplate="footer">
    <button pButton label="Cancelar" class="p-button-text" (click)="displayDialog = false"></button>
    <button pButton label="Guardar Título" (click)="guardar()"></button>
  </ng-template>
</p-dialog>
