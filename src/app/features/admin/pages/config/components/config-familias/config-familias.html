<div class="bg-white rounded-4x shadow-sm border border-slate-100 overflow-hidden">
  <p-table #dtFamilias [value]="familias" [rows]="5" [paginator]="true" styleClass="p-datatable-sm">
    <ng-template pTemplate="caption">
      <div class="flex justify-end p-2">
        <p-selectButton [options]="stateOptions" [(ngModel)]="filtroEstadoFamilia" 
                        (onChange)="filtradoFamilia($event)" optionLabel="label" optionValue="value">
        </p-selectButton>
      </div>
    </ng-template>
    
    <ng-template pTemplate="header">
      <tr>
        <th class="p-6 bg-slate-50 text-slate-400 text-[12px] uppercase font-black">Nombre</th>
        <th class="p-6 bg-slate-50 text-slate-400 text-[12px] uppercase font-black text-center">Estado</th>
        <th class="p-6 bg-slate-50 text-slate-400 text-[12px] uppercase font-black text-center">Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-f>
      <tr class="hover:bg-slate-50/50">
        <td class="p-6 font-bold text-slate-700 capitalize">{{ f.nombre }}</td>
        <td class="p-6 text-center">
          <p-tag [severity]="f.activa ? 'success' : 'secondary'" 
                 [value]="f.activa ? 'ACTIVA' : 'INACTIVA'" [rounded]="true"></p-tag>
        </td>
        <td class="p-6 text-center">
          <div class="flex justify-center gap-2">
            @if (!f.activa) {
              <button pButton icon="pi pi-refresh" class="p-button-text p-button-success" 
                      (click)="onReactivate.emit(f.id)"></button>
            }
            
            <button pButton icon="pi pi-pencil" class="p-button-text p-button-secondary" 
                    (click)="editar(f)"></button>
            
            @if (f.activa) {
              <button pButton icon="pi pi-trash" class="p-button-text p-button-danger" 
                      (click)="onDelete.emit(f.id)"></button>
            }
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [(visible)]="displayFamiliaDialog" appendTo="body" [header]="tituloFamiliaDialog" [modal]="true" [style]="{width: '400px'}">
  <div class="flex flex-col gap-2 mt-2">
    <label class="font-bold text-slate-600">Nombre de la Familia</label>
    <input pInputText [(ngModel)]="nuevaFamilia.nombre" class="w-full" />
  </div>
  <ng-template pTemplate="footer">
    <button pButton label="Cancelar" class="p-button-text" (click)="displayFamiliaDialog = false"></button>
    <button pButton label="Guardar Familia" (click)="guardar()"></button>
  </ng-template>
</p-dialog>
