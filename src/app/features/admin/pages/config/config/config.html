<p-toast></p-toast>

<div class="p-8 bg-slate-50 min-h-screen">
  
  <div class="flex flex-col gap-12 max-w-[1400px] mx-auto">
    
    <section>
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-black text-slate-800">Titulaciones Académicas</h2>
        <button pButton label="Nueva Titulación" icon="pi pi-plus" 
                class="p-button-rounded p-button-success" 
                (click)="titulosComp.abrirNuevo()">
        </button>
      </div>
      <app-config-titulos #titulosComp
        [titulos]="titulos" [niveles]="niveles" [familias]="familias" [cargando]="cargando"
        (onSave)="guardarTitulo($event)" (onDelete)="borrarTitulo($event)" (onReactivate)="reactivarTitulo($event)">
      </app-config-titulos>
    </section>

    <section>
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-black text-slate-800">Familias Profesionales</h2>
        <button pButton label="Nueva Familia" icon="pi pi-plus" 
                class="p-button-rounded p-button-success" 
                (click)="famComp.abrirModal()">
        </button>
      </div>
      <app-config-familias #famComp
        [familias]="familias"
        (onSave)="guardarFamilia($event)" (onDelete)="borrarFamilia($event)" (onReactivate)="reactivarFamilia($event)">
      </app-config-familias>
    </section>

    <section>
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-black text-slate-800">Razones de Cierre (Ofertas)</h2>
        <button pButton label="Nueva Razón" icon="pi pi-plus" 
                class="p-button-rounded p-button-success" 
                (click)="cierreComp.abrirModal()">
        </button>
      </div>
      <app-config-motivos-cierre #cierreComp
        [detalles]="detalles"
        (onSave)="guardarDetalleCierre($event)" (onToggle)="toggleEstadoDetalle($event)">
      </app-config-motivos-cierre>
    </section>

    <section>
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-black text-slate-800">Motivos Baja de Usuario</h2>
        <button pButton label="Nuevo Motivo de Baja" icon="pi pi-plus" 
                class="p-button-rounded p-button-success" 
                (click)="bajaComp.abrirModal()">
        </button>
      </div>
      <app-config-motivos-baja #bajaComp
        [motivosBajaUsuario]="motivosBajaUsuario"
        (onSave)="guardarMotivoBaja($event)" (onToggle)="toggleEstadoMotivoBaja($event)">
      </app-config-motivos-baja>
    </section>

  </div>
</div>
