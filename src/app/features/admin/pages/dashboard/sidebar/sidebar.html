<div class="flex flex-col gap-6"> <div class="bg-white rounded-[2.5rem]  p-6 shadow-sm border border-slate-100 flex flex-col gap-3"> <button pButton label="Inicio" icon="pi pi-chart-line" 
            class="p-button-text nav-link-custom" 
            routerLink="/admin/main" routerLinkActive="active-admin" 
            (click)="closeMenu()"></button>

    <div class="relative w-full">
      <button pButton label="Validaciones" icon="pi pi-bell" 
              class="p-button-text nav-link-custom w-full text-left" 
              routerLink="/admin/validaciones" routerLinkActive="active-admin" 
              (click)="closeMenu()"></button>
      
      @if ((adminService.pendientes$ | async)! > 0) {
        <span class="absolute right-4 top-1/2 -translate-y-1/2 bg-red-600 text-white text-[11px] font-black px-2 py-0.5 rounded-full shadow-md animate-pulse">
          {{ adminService.pendientes$ | async }}
        </span>
      }
    </div>

    <button pButton label="Gestión Usuarios" icon="pi pi-users" 
            class="p-button-text nav-link-custom" 
            routerLink="/admin/usuarios" routerLinkActive="active-admin" 
            (click)="closeMenu()"></button>

    @if (authService.currentUserId === 1) {
      <button pButton label="Gestión Staff" icon="pi pi-shield" 
              class="p-button-text nav-link-custom" 
              routerLink="/admin/staff" routerLinkActive="active-admin" 
              (click)="closeMenu()"></button>
    }

    <button pButton label="Configuración" icon="pi pi-cog" 
            class="p-button-text nav-link-custom" 
            routerLink="/admin/configuracion" routerLinkActive="active-admin" 
            (click)="closeMenu()"></button>
  </div>

  <div class="p-8 bg-slate-900 rounded-[2.5rem] relative group cursor-pointer border border-slate-800 hover:shadow-xl hover:shadow-emerald-900/20 transition-all duration-300"
       routerLink="/admin/validaciones" (click)="closeMenu()">
    
    <div class="flex justify-between items-start mb-5">
      <div class="w-12 h-12 bg-emerald-500/10 rounded-2xl flex items-center justify-center border border-emerald-500/20">
        <i class="pi pi-user-plus text-2xl text-emerald-400"></i>
      </div>
      @if ((adminService.pendientes$ | async)! > 0) {
        <span class="bg-red-600 text-white text-xs px-3 py-1 rounded-full font-black tracking-widest shadow-lg shadow-red-900/40">
          REVISAR
        </span>
      }
    </div>
    
    <p class="font-black text-xl text-white leading-tight tracking-tight">Validar Usuarios</p>
    <div class="flex items-center gap-2 mt-2">
        <div class="w-1.5 h-1.5 rounded-full bg-emerald-500"></div>
        <p class="text-slate-400 text-sm font-medium">Pendientes: <span class="text-white font-bold">{{ (adminService.pendientes$ | async) || 0 }}</span></p>
    </div>
  </div>

</div>
