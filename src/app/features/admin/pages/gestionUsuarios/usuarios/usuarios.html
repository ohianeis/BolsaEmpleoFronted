<p-toast></p-toast>

<div class="p-4 md:p-8 bg-white min-h-screen">
  <div class="mb-8 flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-black text-slate-800 tracking-tighter uppercase italic">
        Gestión de Usuarios
      </h1>
      <p class="text-slate-500 font-medium">Administra alumnos, empresas y el historial de bajas.</p>
    </div>
    <button (click)="refreshAll()" class="p-4 bg-slate-100 hover:bg-slate-200 rounded-2xl transition-all">
      <i class="pi pi-sync text-slate-600"></i>
    </button>
  </div>

  <p-tabs [value]="activeIndex" (valueChange)="onTabChange($event)">
    <p-tablist>
      <p-tab [value]="0">
        <i class="pi pi-users mr-2"></i>Alumnos
      </p-tab>
      <p-tab [value]="1">
        <i class="pi pi-building mr-2"></i>Empresas
      </p-tab>
      <p-tab [value]="2">
        <i class="pi pi-history mr-2"></i>Historial Bajas
      </p-tab>
    </p-tablist>

    <p-tabpanels>
      <p-tabpanel [value]="0">
        <div class="mt-4">
          <app-tabla-alumnos></app-tabla-alumnos>
        </div>
      </p-tabpanel>

      <p-tabpanel [value]="1">
        <div class="mt-4">
          <app-tabla-empresas></app-tabla-empresas>
        </div>
      </p-tabpanel>

      <p-tabpanel [value]="2">
        <div class="mt-4">
          <app-historial-bajas></app-historial-bajas>
        </div>
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</div>
