<div class="space-y-16">
  @for (paso of pasos; track $index) {
    <div class="flex gap-8 relative group">
      
      <div class="flex flex-col items-center">
        <div [ngClass]="colorClase" 
             class="flex-shrink-0 w-14 h-14 text-white rounded-2xl flex items-center justify-center font-black shadow-xl z-10 text-xl transition-transform group-hover:scale-110">
          {{ $index + 1 }}
        </div>
        @if (!$last) {
          <div class="w-0.5 h-full bg-slate-100 my-2"></div>
        }
      </div>

      <div class="pb-8">
        <div class="flex items-center gap-3 mb-3">
          <i [class]="'pi ' + paso.icono + ' text-2xl ' + (colorClase.replace('bg-', 'text-'))"></i>
          <h3 class="text-2xl font-black text-slate-800 tracking-tight">{{ paso.titulo }}</h3>
        </div>

        <p class="text-slate-600 text-lg leading-relaxed mb-4" [innerHTML]="paso.descripcion"></p>

        <div class="grid sm:grid-cols-2 gap-4 mt-6">
          @for (detalle of paso.detalles; track detalle) {
            <div class="bg-slate-50 border border-slate-100 p-4 rounded-2xl flex gap-3 items-start">
              <i class="pi pi-info-circle mt-1 text-slate-400"></i>
              <span class="text-sm text-slate-700 leading-snug" [innerHTML]="detalle"></span>
            </div>
          }
        </div>
      </div>
    </div>
  }
</div>
