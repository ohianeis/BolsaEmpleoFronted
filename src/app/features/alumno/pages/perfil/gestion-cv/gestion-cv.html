<div class="bg-white p-6 rounded-4xl shadow-sm border border-slate-100">
  <h3 class="text-sm font-black text-slate-400 uppercase tracking-[0.2em] mb-4">
    Currículum Vitae
  </h3>

  @if (miCv) {
    <div class="flex items-center justify-between p-3 bg-slate-50 rounded-2xl border border-slate-100 mb-4 transition-all hover:bg-slate-100">
      <div class="flex items-center gap-2 overflow-hidden flex-1">
        <i class="pi pi-file-pdf text-red-500 text-xl! shrink-0"></i>
        <span class="text-lg font-bold text-slate-700 truncate px-2">
          {{ miCv.nombre }}
        </span>
      </div>
      <p-button 
        icon="pi pi-trash text-xl!" 
        [text]="true" 
        severity="danger" 
        (click)="handleDelete()" 
        styleClass="p-button-sm rounded-full">
      </p-button>
    </div>
  }

  <p-fileUpload 
    mode="basic" 
    [chooseLabel]="miCv ? 'Actualizar PDF' : 'Subir CV'" 
    chooseIcon="pi pi-upload" 
    name="file" 
    accept="application/pdf" 
    [customUpload]="true" 
    (uploadHandler)="handleUpload($event)" 
    [auto]="true" 
    styleClass="p-button-success p-button-outlined w-full rounded-xl text-md! font-bold">
  </p-fileUpload>
  
  <p class="text-sm text-slate-400 mt-3 text-center italic">
    Solo archivos PDF (Máx. 2MB)
  </p>
</div>
