<p-toast></p-toast>
<p-confirmDialog [style]="{ width: '450px' }"></p-confirmDialog>

<div class="p-6 max-w-[1000px] mx-auto animate-fadein">
  
  <div class="mb-10 text-left">
    <h1 class="text-4xl font-black text-slate-800 tracking-tight uppercase italic leading-none">Mis Candidaturas</h1>
    <p class="text-slate-500 font-medium mt-3 italic text-lg">Gestiona y revisa el estado de tus inscripciones actuales</p>
  </div>

  <app-candidaturas-tabs
    [tabActual]="tabActual" 
    [totales]="totalesCandidaturas"
    (onTabChange)="ejecutarCambioTab($event)">
  </app-candidaturas-tabs>

  <div class="flex flex-col gap-6 mt-6">
    @if (loading) {
      @for (i of [1,2,3]; track i) {
        <div class="h-32 bg-white rounded-4xl animate-pulse border border-slate-100 shadow-sm"></div>
      }
    } @else {
      @for (oferta of candidaturas; track oferta.id) {
        <app-candidatura-card
          [item]="oferta" 
          [esHistorico]="tabActual === 'retiradas' || tabActual === 'finalizadas'"
          [expandida]="ofertaExpandidaId === oferta.id"
          (onToggleExpandir)="toggleExpandir($event)"
          (onVerEmpresa)="verDetalle($event)"
          (onRetirar)="confirmarDesapuntarse($event)"
          (onReinscribir)="reInscribirse($event)">
        </app-candidatura-card>
      } @empty {
        <div class="text-center py-20 bg-slate-50 rounded-[2.5rem] border-2 border-dashed border-slate-200">
          <i class="pi pi-inbox text-4xl text-slate-300 mb-4 block"></i>
          <p class="text-slate-400 font-bold uppercase tracking-widest italic">No hay registros en esta sección</p>
        </div>
      }
    }
  </div>

  <div class="mt-8 flex justify-center">
    <p-paginator 
      (onPageChange)="onPageChange($event)" 
      [first]="currentPage * rows" 
      [rows]="rows" 
      [totalRecords]="totalRecords" 
      class="bg-transparent border-0">
    </p-paginator>
  </div>

  <app-empresa-drawer
    [(visible)]="displayDetalle" 
    [seleccionada]="seleccionada"
    (onReinscribir)="reInscribirse($event)"
    (onRetirar)="confirmarDesapuntarse($event)">
  </app-empresa-drawer>

</div>
