<div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-gray-100 flex flex-col items-center justify-center min-h-[400px]">
  <h3 class="text-sm font-black text-gray-400 uppercase tracking-[0.2em] mb-8">Distribución de mis Procesos</h3>
  
  <div class="w-full max-w-[320px] h-[300px] relative animate-fadein">
    @if (chartData) {
    <p-chart type="doughnut" [data]="chartData" [options]="chartOptions" height="100%"></p-chart>
    }
    <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none" style="margin-top: -30px;">
      <span class="text-5xl font-black text-slate-800">{{ totalInscripciones }}</span>
      <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Candidaturas</span>
    </div>
  </div>
</div>
