<div class="p-6 max-w-[1700px] mx-auto min-h-screen bg-slate-50/50 animate-fadein">
  
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-6">
    <div>
      <h1 class="text-4xl font-black text-slate-800 tracking-tight uppercase italic leading-none">
        Área del Candidato
      </h1>
      <p class="text-slate-500 font-medium mt-3 italic text-lg">
        Gestiona tus candidaturas y mantén tu perfil profesional al día
      </p>
    </div>
    
    <button pButton 
            label="EXPLORAR OFERTAS" 
            icon="pi pi-search" 
            class="p-button-raised p-button-primary shadow-xl shadow-blue-200 px-8 py-4 font-black tracking-widest text-xs rounded-2xl transition-all hover:scale-105 active:scale-95"
            routerLink="/alumno/ofertas">
    </button>
  </div>

  @if (cargando) {
    <div class="space-y-10">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        @for (i of [1,2,3]; track i) { <div class="h-32 bg-white rounded-2xl animate-pulse border border-slate-100"></div> }
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="h-[400px] bg-white rounded-[2.5rem] animate-pulse border border-slate-100"></div>
        <div class="h-[400px] bg-slate-800 rounded-[2.5rem] animate-pulse"></div>
      </div>
    </div>
  } @else {
    
    @if (dashboardData) {
      <app-alumno-kpis [data]="dashboardData.cards"></app-alumno-kpis>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mt-10 mb-10">
        
        <app-alumno-chart
          [graficoData]="dashboardData.grafico" 
          [totalInscripciones]="dashboardData.cards.inscripciones">
        </app-alumno-chart>

        <app-alumno-empleabilidad-card></app-alumno-empleabilidad-card>

      </div>
    } @else {
      <div class="bg-white rounded-[3rem] p-20 flex flex-col items-center justify-center border border-dashed border-slate-300">
        <i class="pi pi-inbox text-6xl text-slate-200 mb-4"></i>
        <p class="text-slate-400 font-bold uppercase tracking-widest">No hay datos disponibles en este momento</p>
        <button pButton label="REINTENTAR CARGA" (click)="ngOnInit()" class="p-button-text mt-4 font-bold"></button>
      </div>
    }
  }

</div>
