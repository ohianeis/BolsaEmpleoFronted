<div class="min-h-screen bg-slate-50 flex flex-col">
  
  <app-navbar (onMenuToggle)="menuVisible = true"></app-navbar>

  <div class="flex-1 flex justify-center w-full mt-4 md:mt-8 mb-10 px-2 md:px-4">
    <div class="flex w-full max-w-[1700px] gap-8">
      
      <app-sidebar class="w-64 xl:w-72 hidden lg:block shrink-0"></app-sidebar>

      <main class="flex-1 bg-white rounded-3xl md:rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden min-h-[70vh]">
        <div class="p-4 md:p-10">
          <router-outlet></router-outlet>
        </div>
      </main>

    </div>
  </div>
</div>

<p-drawer [(visible)]="menuVisible" [header]="'Menú Alumno'" [style]="{ width: '320px' }">
  <div class="py-4">
    <app-sidebar (onItemClick)="menuVisible = false"></app-sidebar>
  </div>
</p-drawer>
