<div class="min-h-screen bg-slate-50 flex flex-col">
  <nav
    class="w-full bg-white border-b border-slate-200 px-4 py-6 shadow-sm z-10 flex justify-center"
  >
    <div class="w-full max-w-[1700px] flex justify-between items-center px-4">
      <div class="flex items-center gap-4 md:gap-6">
        <button
          pButton
          icon="pi pi-bars"
          class="p-button-text p-button-secondary flex lg:hidden!"
          (click)="menuVisible = true"
        ></button>

        <div
          class="w-24 h-16 md:w-32 md:h-24 overflow-hidden rounded-2xl bg-white flex items-center justify-center p-3 border border-blue-100 shadow-sm"
        >
          <img
            src="assets/img/cipBurlada.jpg"
            alt="logo cip burlada"
            class="w-full h-full object-contain"
          />
        </div>

        <div class="flex flex-col justify-center">
          <h1
            class="text-slate-800 text-xl md:text-3xl font-black tracking-tighter leading-none uppercase m-0"
          >
            Politécnico <span class="text-blue-600 font-bold">CIP Burlada</span>
          </h1>
          <div class="flex items-center gap-2 mt-2">
            <span
              class="px-3 py-1 bg-blue-600 text-white text-[11px] md:text-[12px] font-black uppercase tracking-widest rounded-lg shadow-md shadow-blue-100"
            >
              Portal de Empleo
            </span>
          </div>
        </div>
      </div>

      <div
        class="flex items-center gap-4 md:gap-8 bg-blue-50/50 py-3 px-6 rounded-3xl border border-blue-100 shadow-inner"
      >
        <div class="hidden sm:flex flex-col items-end border-r border-blue-200 pr-6">
          <span class="text-[18px] font-black text-slate-700 leading-none tracking-tight"
            >Hola, {{ nombreUsuario }}</span
          >
          <span class="text-[12px] text-blue-600 font-bold uppercase mt-1.5 italic tracking-wide">
            Portal Alumnos
          </span>
        </div>

        <div class="flex items-center gap-4">
          <p-avatar
            icon="pi pi-user"
            shape="circle"
            [style]="{ width: '3.5rem', height: '3.5rem', 'font-size': '1.5rem' }"
            styleClass="bg-blue-600 text-white shadow-lg shadow-blue-200 border-2 border-blue-400"
          >
          </p-avatar>
          <app-log-out class="scale-125 origin-left"></app-log-out>
        </div>
      </div>
    </div>
  </nav>

  <div class="flex-1 flex justify-center w-full mt-4 md:mt-8 mb-10 px-2 md:px-4">
    <div class="flex w-full max-w-[1700px] gap-8">
      <aside class="w-64 xl:w-72 hidden  lg:flex flex-col gap-4 shrink-0">
        <div class="bg-white rounded-[2.5rem] p-5 shadow-sm border border-slate-100">
          <ng-container *ngTemplateOutlet="menuItems"></ng-container>
        </div>

        <ng-container *ngTemplateOutlet="extraCards"></ng-container>
      </aside>

      <main
        class="flex-1 bg-white rounded-3xl md:rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden min-h-[70vh]"
      >
        <div class="p-4 md:p-10">
          <router-outlet></router-outlet>
        </div>
      </main>
    </div>
  </div>
</div>

<p-drawer [(visible)]="menuVisible" [header]="'Menú Alumno'" [style]="{ width: '300px' }">
  <div class="flex flex-col h-full overflow-y-auto pb-6">
    <nav class="flex flex-col gap-2 mt-4">
      <ng-container *ngTemplateOutlet="menuItems"></ng-container>
    </nav>

    <div class="mt-6 pt-6 border-t border-slate-100">
      <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-4 px-4">
        Recursos
      </p>
      <ng-container *ngTemplateOutlet="extraCards"></ng-container>
    </div>
  </div>
</p-drawer>

<ng-template #menuItems>
  <div class="flex flex-col gap-1 menu-items-alumno">
    <button
      pButton
      label="Inicio"
      icon="pi pi-home"
      class="p-button-text w-full text-left py-4 text-[17px] font-bold tracking-tight"
      routerLink="/alumno/dashboard"
      routerLinkActive="active-alumno"
      (click)="menuVisible = false"
    ></button>

    <button
      pButton
      label="Buscar Ofertas"
      icon="pi pi-search"
      class="p-button-text w-full text-left py-4 text-[17px] font-bold tracking-tight"
      routerLink="/alumno/ofertas"
      routerLinkActive="active-alumno"
      (click)="menuVisible = false"
    ></button>

    <button
      pButton
      label="Mis Candidaturas"
      icon="pi pi-send"
      class="p-button-text w-full text-left py-4 text-[17px] font-bold tracking-tight"
      routerLink="/alumno/candidaturas"
      routerLinkActive="active-alumno"
      (click)="menuVisible = false"
    ></button>

    <button
      pButton
      label="Mi Perfil / Títulos"
      icon="pi pi-graduation-cap"
      class="p-button-text w-full text-left py-4 text-[17px] font-bold tracking-tight"
      routerLink="/alumno/perfil"
      routerLinkActive="active-alumno"
      (click)="menuVisible = false"
    ></button>
  </div>
</ng-template>

<ng-template #extraCards>
  <div class="flex flex-col gap-4">
    <div
      class="p-6 bg-gradient-to-br from-blue-600 to-blue-700 rounded-[2.5rem] text-white shadow-lg cursor-pointer hover:scale-[1.02] transition-all duration-300 group"
      routerLink="ayuda"
      (click)="menuVisible = false"
    >
      <div class="flex justify-between items-start mb-3">
        <i
          class="pi pi-question-circle text-3xl opacity-70 group-hover:opacity-100 transition-opacity"
        ></i>
        <i class="pi pi-arrow-up-right text-sm opacity-70 group-hover:opacity-100"></i>
      </div>
      <p class="font-bold text-xl mb-1 leading-tight">Guía del Alumno</p>
      <p class="text-blue-50 text-sm leading-snug opacity-90">
        Potencia tu perfil y consigue el match perfecto.
      </p>
    </div>

    <div class="p-6 bg-blue-50 rounded-[2.5rem] border border-blue-100">
      <p class="text-blue-600 font-black text-xs mb-2 uppercase tracking-widest">¿Dudas?</p>
      <p class="text-slate-600 text-xs leading-relaxed">
        Contacta con <strong>Secretaría</strong> para cualquier incidencia técnica o académica.
      </p>
      <a
        href="mailto:secretaria@centro.com"
        class="inline-block mt-3 text-blue-600 font-bold text-xs hover:underline"
      >
        Enviar email →
      </a>
    </div>
  </div>
</ng-template>
