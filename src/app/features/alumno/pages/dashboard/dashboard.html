<div class="min-h-screen bg-slate-50 flex flex-col">
  
  <nav class="w-full bg-white border-b border-slate-200 px-4 py-4 shadow-sm z-10 flex justify-center">
    <div class="w-full max-w-[1300px] flex justify-between items-center px-2">
      
      <div class="flex items-center gap-2 md:gap-4">
<button pButton icon="pi pi-bars" 
        class="p-button-text p-button-secondary md:!hidden" 
        (click)="menuVisible = true">
</button>

        <div class="bg-blue-600 text-white w-10 h-10 md:w-12 md:h-12 rounded-2xl flex items-center justify-center font-black shadow-lg text-lg md:text-xl">
          P
        </div>
        <div>
          <h1 class="text-slate-800 text-lg md:text-xl font-black tracking-tight leading-none uppercase">Politécnico</h1>
          <p class="text-[9px] md:text-[11px] text-blue-500 font-bold uppercase tracking-[0.2em] mt-1">Portal de Empleo</p>
        </div>
      </div>

      <div class="flex items-center gap-2 md:gap-6 bg-slate-50 py-1 md:py-2 px-2 md:px-4 rounded-2xl border border-slate-100">
        <div class="hidden sm:flex flex-col items-end border-r border-slate-200 pr-4">
          <span class="text-sm font-black text-slate-700 leading-none">Hola, {{ nombreUsuario }}</span>
          <span class="text-[10px] text-slate-400 font-bold uppercase mt-1">Portal Alumnos</span>
        </div>
        
        <div class="flex items-center gap-1 md:gap-3">
          <p-avatar icon="pi pi-user" shape="circle" styleClass="bg-white text-blue-600 border border-blue-100 shadow-sm"></p-avatar>
          <button pButton icon="pi pi-sign-out" 
                  class="p-button-rounded p-button-danger p-button-text p-button-sm hover:bg-red-50"
                  (click)="onLogout()"></button>
        </div>
      </div>
    </div>
  </nav>

  <div class="flex-1 flex justify-center w-full mt-4 md:mt-8 mb-10 px-2 md:px-4">
    <div class="flex w-full max-w-[1300px] gap-8">
      
<aside class="w-64 xl:w-72 hidden md:flex flex-col gap-4 flex-shrink-0 transition-all duration-300">        <div class="bg-white rounded-[2.5rem] p-5 shadow-sm border border-slate-100">
           <ng-container *ngTemplateOutlet="menuItems"></ng-container>
        </div>
        
      <div class="p-6 bg-gradient-to-br from-blue-600 to-blue-700 rounded-[2.5rem] text-white shadow-md 
            cursor-pointer hover:shadow-xl hover:scale-[1.02] transition-all duration-300 group"
     routerLink="ayuda">
  <div class="flex justify-between items-start mb-3">
    <i class="pi pi-question-circle text-2xl opacity-50 group-hover:opacity-100 transition-opacity"></i>
    <i class="pi pi-arrow-up-right text-xs opacity-50 group-hover:opacity-100"></i>
  </div>
  <p class="font-bold text-sm mb-1">Guía del Alumno</p>
  <p class="text-blue-100 text-[10px] leading-relaxed">
    Descubre cómo potenciar tu perfil y conseguir el match perfecto.
  </p>
</div>
      </aside>

      <main class="flex-1 bg-white rounded-3xl md:rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden min-h-[70vh]">
        <div class="p-4 md:p-10">
           <router-outlet></router-outlet>
        </div>
      </main>
    </div>
  </div>
</div>

<p-drawer [(visible)]="menuVisible" [header]="'Menú Alumno'" [style]="{ width: '280px' }">
  <div class="flex flex-col h-full">
    <nav class="flex flex-col gap-2 mt-4">
      <ng-container *ngTemplateOutlet="menuItems"></ng-container>
    </nav>
    
    <div class="mt-auto p-4 bg-slate-50 rounded-2xl mb-4">
      <p class="text-blue-600 font-bold text-xs mb-1">Ayuda</p>
      <p class="text-slate-500 text-[10px]">Contacta con secretaría para dudas académicas.</p>
    </div>
  </div>
</p-drawer>



<ng-template #menuItems>
  <button
    pButton
    label="Inicio"
    icon="pi pi-home"
    class="p-button-text w-full text-left"
    routerLink="/alumno/dashboard"
    routerLinkActive="bg-slate-200"
    (click)="menuVisible = false"
  ></button>

  <button
    pButton
    label="Buscar Ofertas"
    icon="pi pi-search"
    class="p-button-text w-full text-left"
    routerLink="/alumno/ofertas"
    routerLinkActive="bg-slate-200"
    (click)="menuVisible = false"
  ></button>

  <button
    pButton
    label="Mis Candidaturas"
    icon="pi pi-send"
    class="p-button-text w-full text-left"
    routerLink="/alumno/candidaturas" 
    routerLinkActive="bg-slate-200"
    (click)="menuVisible = false"
  ></button>

  <button
    pButton
    label="Mi Perfil / Títulos"
    icon="pi pi-graduation-cap"
    class="p-button-text w-full text-left"
    routerLink="/alumno/perfil"
    routerLinkActive="bg-slate-200"
    (click)="menuVisible = false"
  ></button>
</ng-template>
