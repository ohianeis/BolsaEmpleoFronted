@defer(on viewport) {
<footer class="w-full bg-slate-50 border-t-4  shadow-inner font-sans">
  
  <div class="w-full flex justify-center">
    
    <div class="w-full max-w-[1700px] flex flex-col md:flex-row items-stretch min-h-[300px]">
      
      <div class="w-full md:w-[70%] lg:w-[65%] xl:w-[60%] bg-[#003E87] text-white p-8 md:p-12 flex flex-col lg:flex-row items-center gap-8 lg:gap-16 transition-all duration-500">
          
          <div class="w-full lg:w-3/5 h-64 md:h-80 rounded-[2.5rem] overflow-hidden shadow-2xl border-4 border-white/10 group relative flex-shrink-0">
            <img src="assets/img/mapa-footer.png" 
                 alt="Mapa CIP Burlada" 
                 class="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110" />
            <div class="absolute inset-0 bg-blue-900/5 group-hover:bg-transparent transition-colors"></div>
          </div>

          <div class="w-full lg:w-2/5 flex flex-col gap-6">
            <h3 class="text-2xl font-black tracking-tighter uppercase border-b-2 border-white/20 pb-2 inline-block">
              Contacto
            </h3>
            <div class="space-y-5">
              <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center flex-shrink-0">
                  <i class="pi pi-map-marker"></i>
                </div>
                <p class="text-sm font-bold leading-tight italic">C/ Ermitako kalea, 19, <br> 31600 Burlada</p>
              </div>
              <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center flex-shrink-0">
                  <i class="pi pi-envelope"></i>
                </div>
                <p class="text-sm font-bold truncate">ciburlada&#64;educacion.navarra.es</p>
              </div>
            </div>
          </div>
      </div>

      <div class="w-full md:w-[30%] lg:w-[35%] xl:w-[40%] bg-white border-l border-slate-100 transition-all duration-500 flex flex-col items-center justify-center p-8 md:p-12">
          
          <h2 class="text-2xl font-black tracking-tighter text-slate-800 pb-2 mb-10 border-b-2 border-blue-600 uppercase">
            Síguenos
          </h2>
          
          <div class="flex flex-col gap-4 w-full max-w-[280px]">
            <a href="#" class="flex items-center gap-4 group bg-slate-50 p-4 rounded-2xl hover:bg-blue-50 transition-all border border-slate-100">
              <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center text-[#004494] group-hover:bg-[#004494] group-hover:text-white shadow-sm transition-all">
                <i class="pi pi-instagram text-xl"></i>
              </div>
              <span class="font-black text-slate-600 text-[10px] uppercase tracking-widest">Instagram</span>
            </a>

            <a href="#" class="flex items-center gap-4 group bg-slate-50 p-4 rounded-2xl hover:bg-blue-50 transition-all border border-slate-100">
              <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center text-[#004494] group-hover:bg-[#004494] group-hover:text-white shadow-sm transition-all">
                <i class="pi pi-facebook text-xl"></i>
              </div>
              <span class="font-black text-slate-600 text-[10px] uppercase tracking-widest">Facebook</span>
            </a>
          </div>

          <p class="mt-12 text-[10px] font-black text-slate-300 uppercase tracking-[0.4em]">
            &copy; 2026 CIP Burlada
          </p>
      </div>

    </div>
  </div>
</footer>
} @placeholder {
  <div class="w-full h-20 bg-slate-100 flex items-center justify-center">
    <i class="pi pi-spin pi-spinner text-slate-300"></i>
  </div>
}
